  <script>
    // ============================================================
    // CREFUL SITE CO-PILOT — Chat Engine (Gemini API)
    // ============================================================

    // --- State ---
    let kbData = [];
    let kbContextText = '';
    let userName = '';
    let conversationState = 'AWAITING_NAME';
    let isProcessing = false;
    let messageHistory = [];

    // --- Model (from localStorage, fallback to default) ---
    let selectedModel = localStorage.getItem('creful_model') || 'gemini-2.5-flash';

    // --- KB Module files ---
    const KB_FILES = [
      'KB/Module 1.1.json', 'KB/Module 1.2.json', 'KB/Module 1.3.json', 'KB/Module 1.4.json',
      'KB/Module 3.1.json', 'KB/Module 3.2.json', 'KB/Module 3.3.json', 'KB/Module 3.4.json',
      'KB/Module 3.5.json', 'KB/Module 3.6.json', 'KB/Module 3.7.json', 'KB/Module 4.1.json',
      'KB/Module 4.2.json', 'KB/Module 4.3.json'
    ];

    // --- Quick Reply Suggestions ---
    const QUICK_REPLIES = [
      'Shop Drawing คืออะไร?',
      'ขั้นตอนทำ RFA',
      'ก่อนปิดฝ้าต้องเช็คอะไร?',
      'ลูกค้าสั่งปากเปล่าทำยังไง?'
    ];

    // --- System Instructions (Guardrails + Hybrid Knowledge) ---
    const SYSTEM_INSTRUCTION = `=== บทบาทหลัก (Primary Persona) ===
คุณคือ "Site Co-pilot" ผู้ช่วย AI ประจำไซต์งานก่อสร้างตกแต่งภายในของบริษัท Creful
หน้าที่หลักคือ ให้คำปรึกษาและตอบคำถาม Foreman หน้างาน โดยอ้างอิงจากข้อมูลใน Knowledge Base (KB) ที่ให้ไว้เป็นลำดับแรกเสมอ

=== บทบาทเสริม (Secondary Persona) ===
นอกจากนี้ คุณยังสวมบทบาทเป็น "Professional Project Manager (PM) ของบริษัทรับเหมาตกแต่งภายใน (Interior Contractor)" ที่มีประสบการณ์สูง
หากข้อมูลใน KB ไม่ครบถ้วนเพียงพอ คุณสามารถใช้ความรู้และประสบการณ์ในฐานะ PM มาให้คำแนะนำเสริมได้ แต่ต้องแยกส่วนให้ชัดเจนตามรูปแบบที่กำหนดไว้ด้านล่าง

=== กฎเหล็กและข้อห้าม (Strict Guardrails) ===
1. No Guessing — Zero Tolerance สำหรับเรื่องต่อไปนี้ (ห้ามเดาเด็ดขาดไม่ว่ากรณีใดๆ):
   - ห้ามเดาตัวเลข ระยะ ขนาด ปริมาณ สเปค (Specification) ใดๆ ทั้งสิ้น
   - ห้ามเดาเรื่องความปลอดภัย (Safety) หรือโครงสร้างรับน้ำหนัก (Structural)
   - หากข้อมูลเหล่านี้ไม่มีใน KB ให้ปฏิเสธตอบ และแนะนำให้ถามผู้เชี่ยวชาญ/ส่งเรื่องต่อ
2. Hybrid Knowledge — อนุญาตให้แนะนำเสริมได้ ในกรณีต่อไปนี้:
   - คำถามเกี่ยวกับการบริหารจัดการงานก่อสร้างตกแต่งภายใน (Project Management)
   - คำถามเชิงกระบวนการทำงานทั่วไป (Workflow / Best Practice)
   - คำถามเรื่องการประสานงาน การสื่อสาร การแก้ปัญหาหน้างาน
   - โดยต้องแยกคำแนะนำเสริมออกจากส่วนที่อ้างอิง KB อย่างชัดเจน (ดูรูปแบบการตอบด้านล่าง)
3. Strict Escalation (การส่งเรื่องต่อ): หากคำถามตรงกับเงื่อนไขต่อไปนี้ ห้ามแนะนำให้ทำเอง แต่ต้องบังคับให้ส่งเรื่องต่อ (Escalate) ทันที:
   - เรื่อง Spec วัสดุ หรือเทียบเท่า -> ให้ส่งเรื่องให้ PM + Designer/CM
   - เรื่องผนังกันไฟ (Firestop / Fire-rated wall) -> บังคับส่งเรื่องให้ QA/QC + CM ทันที
   - เรื่องโครงสร้างรับน้ำหนัก (Structural) หรือความปลอดภัยหน้างาน -> ให้ส่งเรื่องให้ CM/Engineer
   - เรื่องแบบงานระบบขัดแย้ง (MEP design change / Clash) -> ให้ส่งเรื่องให้ MEP Supervisor + CM
   - เรื่องงบประมาณ, งานเพิ่มลด (VO), หรือขอบเขตงาน (Scope) -> ให้ส่งเรื่องให้ PM + QS

=== รูปแบบการตอบกลับและลำดับการเล่าเรื่อง (Conversational Flow) ===
คุณต้องสวมบทบาทเป็น "พี่ช่างผู้เชี่ยวชาญที่กำลังสอนน้องโฟร์แมน" ใช้ภาษาแชทที่อ่านง่าย เป็นกันเอง กระชับ ตรงไปตรงมา (ลงท้ายด้วย ครับ/ค่ะ เสมอ) 

🚨 กฎสำคัญด้านรูปแบบ: ห้ามคัดลอกหัวข้อ (เช่น "ส่วนที่ 1", "ข้อ 1. ตอบตรงคำถาม") มาแสดงผลเด็ดขาด ให้ร้อยเรียงเนื้อหาเป็นธรรมชาติเหมือนคนพิมพ์แชทคุยกัน โดยเรียงลำดับความคิดดังนี้:

1. ฟันธงและบอกสิ่งที่ต้องทำ (จาก KB):
   - เปิดประโยคด้วยการตอบคำถามทันที (ทำได้/ไม่ได้/ต้องระวังอะไร)
   - อธิบายสั้นๆ หรือลิสต์ Bullet point (ถ้ามีหลายข้อ) ว่าหน้างานต้องทำอะไร เก็บหลักฐานอะไร หรือต้องส่งเรื่องต่อให้ใคร (ถ้าตรงเงื่อนไข Escalate)
   - ร้อยเรียงให้อ่านง่าย ไม่ต้องแยกหัวข้อ "ขั้นตอนปฏิบัติ" หรือ "การส่งเรื่องต่อ" ให้เห็นชัดเจน แต่ให้เขียนรวมเป็นเนื้อเดียวกัน

2. คำแนะนำเสริม (General Advice): 
   - *เงื่อนไข:* ใส่เฉพาะเมื่อข้อมูลใน KB ไม่ครบถ้วน (ความครบถ้วนขององค์ความรู้ < 100%) และเป็นเรื่องงานตกแต่งภายใน
   - ให้ขึ้นย่อหน้าใหม่ พิมพ์แค่ "💡 คำแนะนำเพิ่มเติมจากพี่ (ในมุม PM):" แล้วพิมพ์คำแนะนำลงไป
   - ปิดท้ายย่อหน้านี้ด้วยตัวเอียงว่า: "*(หมายเหตุ: คำแนะนำนี้ประเมินจากประสบการณ์หน้างาน ควรดูหน้างานจริงประกอบด้วยครับ)*"

3. การอ้างอิง (ใส่บรรทัดล่างสุดเสมอ):
   - ห้ามลืมเด็ดขาด ให้ขึ้นบรรทัดใหม่ล่างสุด พิมพ์ข้อความเป็นตัวเอียง สีจางๆ หรือในวงเล็บ เพื่อให้เป็นเหมือน Status Bar ที่ไม่กวนสายตา
   - ให้ใช้รูปแบบ Icon ตามนี้เป๊ะๆ: 
     *(📚 ข้อมูล: XX% | 🎯 มั่นใจ: XX% | 🔗 Ref: [doc_id])*
   - นิยาม: 📚 ข้อมูล = ความครบถ้วนขององค์ความรู้, 🎯 มั่นใจ = ความมั่นใจในการตอบ, 🔗 Ref = เอกสารอ้างอิงจาก KB

=== ข้อสำคัญ ===
- ชื่อผู้ใช้ที่ต้องเรียก: จะระบุไว้ในข้อความแรกของ conversation
- ตอบเป็นภาษาไทยเสมอ
- ห้ามตอบเรื่องที่ไม่เกี่ยวข้องกับงานก่อสร้างตกแต่งภายในโดยสิ้นเชิง`;

    // ============================================================
    // INITIALIZATION
    // ============================================================
    async function init() {
      createParticles();
      await loadKB();
      loadSettings();
      checkApiKey();
      showGreeting();
    }

    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (8 + Math.random() * 15) + 's';
        p.style.animationDelay = (-Math.random() * 20) + 's';
        p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
        container.appendChild(p);
      }
    }

    async function loadKB() {
      // Detect file:// protocol — fetch() will fail in this case
      if (location.protocol === 'file:') {
        console.error('❌ กรุณาเปิดผ่าน http-server ไม่ใช่ double-click ไฟล์โดยตรง');
        // Will show warning in chat after greeting is displayed
        window._fileProtocolWarning = true;
        return;
      }

      const promises = KB_FILES.map(async (file) => {
        // Build absolute URL relative to current page (handles spaces correctly)
        const url = new URL(file, location.href).href;
        try {
          console.log(`📂 Loading: ${url}`);
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return await res.json();
        } catch (e) {
          console.warn(`⚠️ Could not load ${url}:`, e.message);
          return [];
        }
      });
      const results = await Promise.all(promises);
      kbData = results.flat();
      console.log(`✅ KB Loaded: ${kbData.length} chunks from ${KB_FILES.length} modules`);
      kbContextText = buildKBContext();
    }


    function buildKBContext() {
      let ctx = '=== KNOWLEDGE BASE (ฐานข้อมูล) ===\n\n';
      for (const chunk of kbData) {
        ctx += `[doc_id: ${chunk.metadata.doc_id}] [Module: ${chunk.metadata.module_id}] [Type: ${chunk.metadata.chunk_type}] [Tags: ${(chunk.metadata.topic_tags || []).join(', ')}]\n`;
        ctx += chunk.content + '\n\n---\n\n';
      }
      return ctx;
    }

    function checkApiKey() {
      if (!CONFIG.GEMINI_API_KEY || CONFIG.GEMINI_API_KEY === 'YOUR_API_KEY_HERE') {
        console.warn('⚠️ Gemini API Key ยังไม่ได้ตั้งค่า — กรุณาแก้ไขไฟล์ config.js');
      } else {
        console.log('✅ API Key loaded from config.js');
      }
    }

    function showGreeting() {
      addBotMessage('สวัสดีครับ! 🏗️ ผมเป็น <strong>Site Co-pilot</strong> ผู้ช่วย AI ประจำไซต์งานของ Creful\n\nก่อนอื่นเลย ขอทราบ<strong>ชื่อหรือชื่อเล่น</strong>ของคุณด้วยนะครับ เพื่อจะได้เรียกถูกตลอดบทสนทนาครับ 😊');

      // Warn if opened via file:// instead of a web server
      if (window._fileProtocolWarning) {
        addBotMessage('⚠️ <strong>ตรวจพบปัญหา: เปิดไฟล์โดยตรงแทน Web Server</strong>\n\nขณะนี้เปิด index.html แบบ <strong>double-click</strong> (file://) ซึ่งทำให้โหลดข้อมูล KB ไม่ได้ครับ\n\n<strong>วิธีแก้ไข:</strong>\n1. เปิด Terminal / PowerShell ที่โฟลเดอร์โปรเจกต์\n2. รันคำสั่ง: <code>npx -y http-server . -p 8080 -c-1</code>\n3. เปิด Browser แล้วไปที่ <strong>http://127.0.0.1:8080/index.html</strong>\n\n<span class="citation">KB ไม่ได้ถูกโหลด — ระบบจะตอบได้แค่จากความรู้ทั่วไปของ AI เท่านั้น</span>');
      }
    }

    // ============================================================
    // SETTINGS (Model only — API Key lives in config.js)
    // ============================================================
    function loadSettings() {
      selectedModel = localStorage.getItem('creful_model') || 'gemini-2.5-flash';
      document.getElementById('modelSelect').value = selectedModel;
      updateModelBadge();
    }

    function updateModelBadge() {
      const badge = document.getElementById('modelBadge');
      if (badge) badge.textContent = selectedModel;
    }

    function openSettings() {
      document.getElementById('modelSelect').value = selectedModel;
      document.getElementById('settingsOverlay').classList.add('active');
    }

    function closeSettings() {
      document.getElementById('settingsOverlay').classList.remove('active');
    }

    function closeSettingsOutside(e) {
      if (e.target === document.getElementById('settingsOverlay')) closeSettings();
    }

    function saveSettings() {
      selectedModel = document.getElementById('modelSelect').value;
      localStorage.setItem('creful_model', selectedModel);
      updateModelBadge();
      closeSettings();
      showToast('✅ บันทึกการตั้งค่าเรียบร้อย!', false);
    }

    // ============================================================
    // MESSAGE HANDLING
    // ============================================================
    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text || isProcessing) return;

      addUserMessage(text);
      input.value = '';
      input.style.height = 'auto';
      isProcessing = true;

      const typingEl = showTyping();

      try {
        if (conversationState === 'AWAITING_NAME') {
          await delay(500);
          typingEl.remove();
          handleNameInput(text);
        } else {
          await handleQuestion(text, typingEl);
        }
      } catch (err) {
        typingEl.remove();
        // Log full error to console for debugging
        console.error('❌ Gemini API Error:', err);
        showToast('❌ เกิดข้อผิดพลาด — ดู Console log', true);
        addBotMessage('ขออภัยครับ ระบบ AI ขัดข้องชั่วคราว ไม่สามารถประมวลผลคำถามได้ครับ 😔\n\nกรุณาลองใหม่อีกครั้ง หรือตรวจสอบ API Key ในไฟล์ <strong>config.js</strong> ว่าถูกต้องครับ\n\n<span class="citation">Error: ' + escapeHtml(err.message) + '</span>');
      }

      isProcessing = false;
    }

    function handleNameInput(text) {
      userName = text.replace(/^(ผม|ฉัน|ชื่อ|เรียก|ครับ|ค่ะ|คะ|นะ|จ้า|ชื่อว่า|คือ|เป็น)\s*/gi, '').trim() || text.trim();
      conversationState = 'ACTIVE';

      messageHistory.push({ role: 'user', parts: [{ text: `ชื่อผมคือ ${userName}` }] });

      let greeting = `ยินดีที่ได้รู้จักครับ <strong>คุณ${userName}</strong>! 💪\n\n`;
      greeting += `ผมพร้อมช่วยให้คำปรึกษาเรื่องงานก่อสร้างตกแต่งภายในแล้วครับ ถามมาได้เลย เช่น:\n`;
      greeting += `• ขั้นตอนการทำ Shop Drawing\n`;
      greeting += `• การตรวจสอบ MEP ก่อนปิดฝ้า\n`;
      greeting += `• การจัดการกรณีลูกค้าสั่งเปลี่ยนหน้างาน\n`;
      greeting += `• ข้อผิดพลาดที่พบบ่อยในงานต่างๆ`;

      // Warn if API key not set
      if (!CONFIG.GEMINI_API_KEY || CONFIG.GEMINI_API_KEY === 'YOUR_API_KEY_HERE') {
        greeting += `\n\n⚠️ <em>API Key ยังไม่ได้ตั้งค่า — กรุณาแก้ไขไฟล์ config.js ก่อนถามคำถามนะครับ</em>`;
      }

      addBotMessage(greeting);

      messageHistory.push({
        role: 'model',
        parts: [{ text: `ยินดีที่ได้รู้จักครับ คุณ${userName}! ผมพร้อมช่วยให้คำปรึกษาเรื่องงานก่อสร้างตกแต่งภายในแล้วครับ` }]
      });

      showQuickReplies();
    }

    async function handleQuestion(text, typingEl) {
      // Validate API key from config.js
      if (!CONFIG.GEMINI_API_KEY || CONFIG.GEMINI_API_KEY === 'YOUR_API_KEY_HERE') {
        typingEl.remove();
        addBotMessage('⚠️ กรุณาตั้งค่า <strong>API Key</strong> ก่อนนะครับ\n\nเปิดไฟล์ <strong>config.js</strong> แล้วใส่ Gemini API Key ของคุณแทนค่า "YOUR_API_KEY_HERE" ครับ');
        return;
      }

      document.getElementById('statusText').textContent = 'กำลังคิดคำตอบ...';

      messageHistory.push({ role: 'user', parts: [{ text }] });

      // Start response timer
      const startTime = performance.now();

      const response = await callGeminiAPI(text);

      // Calculate elapsed time in seconds (2 decimal places)
      const responseTime = ((performance.now() - startTime) / 1000).toFixed(2);

      typingEl.remove();
      document.getElementById('statusText').textContent = 'พร้อมให้คำปรึกษา';

      addBotMessage(response);
      messageHistory.push({ role: 'model', parts: [{ text: response }] });

      // Fire-and-forget: log to Google Sheet (does not await)
      sendLogToSheet(text, response, responseTime, selectedModel);

      // Keep history manageable (last 20 turns = 40 entries)
      if (messageHistory.length > 40) {
        messageHistory = messageHistory.slice(-40);
      }
    }

    // ============================================================
    // GOOGLE SHEET LOGGING (fire-and-forget)
    // ============================================================
    function sendLogToSheet(question, answer, responseTime, model) {
      const webhookUrl = CONFIG.GOOGLE_SHEET_WEBHOOK_URL;
      if (!webhookUrl || webhookUrl === 'YOUR_WEBHOOK_URL_HERE') {
        console.info('📋 Sheet logging skipped — GOOGLE_SHEET_WEBHOOK_URL not set in config.js');
        return;
      }

      // Format current timestamp as YYYY-MM-DD HH:mm:ss (local time)
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const dateTimeStamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ` +
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

      const payload = {
        DateTimeStamp: dateTimeStamp,
        NickName: userName || 'ไม่ระบุชื่อ',
        Question: question,
        Answer: answer,
        ResponseTime: responseTime,
        Model: model
      };

      // Fire-and-forget — no-cors avoids CORS preflight issues with Apps Script
      fetch(webhookUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        console.log(`📋 Log sent — ${dateTimeStamp} | ${responseTime}s`);
      }).catch(err => {
        console.warn('📋 Sheet log failed (non-critical):', err.message);
      });
    }

    // ============================================================
    // GEMINI API
    // ============================================================
    async function callGeminiAPI(userMessage) {
      const apiKey = CONFIG.GEMINI_API_KEY;
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`;

      const payload = {
        system_instruction: {
          parts: [
            { text: SYSTEM_INSTRUCTION },
            { text: kbContextText }
          ]
        },
        contents: [...messageHistory],
        generationConfig: {
          temperature: 0.3,
          topP: 0.85,
          topK: 40,
          maxOutputTokens: 2048
        },
        safetySettings: [
          { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
          { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
          { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
          { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
        ]
      };

      console.log(`📡 Calling Gemini API — Model: ${selectedModel}`);

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        const errMsg = errData?.error?.message || `HTTP ${res.status} — ${res.statusText}`;
        const errCode = errData?.error?.code || res.status;
        console.error(`❌ API Error [${errCode}]:`, errMsg);
        throw new Error(`[${errCode}] ${errMsg}`);
      }

      const data = await res.json();
      const candidate = data?.candidates?.[0];

      if (!candidate) {
        console.error('❌ No candidate in API response:', JSON.stringify(data, null, 2));
        throw new Error('ไม่ได้รับคำตอบจาก AI — อาจถูกบล็อกโดย Safety Filter');
      }

      const text = candidate.content?.parts?.map(p => p.text).join('') || '';
      if (!text) {
        console.error('❌ Empty response from API:', JSON.stringify(candidate, null, 2));
        throw new Error('คำตอบจาก AI ว่างเปล่า');
      }

      return text;
    }

    // ============================================================
    // UI HELPERS
    // ============================================================
    function addBotMessage(html) {
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'message bot';
      const formatted = html
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        // Wrap italic citation lines: *(📚 ... )* → styled div
        .replace(/\*\((📚[^)]+)\)\*/g, '<div class="citation-text">($1)</div>')
        .replace(/\n/g, '<br>');
      div.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="bubble">${formatted}</div>
      `;
      container.appendChild(div);
      scrollToBottom();
    }

    function addUserMessage(text) {
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'message user';
      div.innerHTML = `
        <div class="avatar">👷</div>
        <div class="bubble">${escapeHtml(text)}</div>
      `;
      container.appendChild(div);
      scrollToBottom();
    }

    function showTyping() {
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'message bot';
      div.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="bubble">
          <div class="typing-indicator">
            <span></span><span></span><span></span>
          </div>
        </div>
      `;
      container.appendChild(div);
      scrollToBottom();
      return div;
    }

    function showQuickReplies() {
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'quick-replies';
      div.style.paddingLeft = '44px';
      QUICK_REPLIES.forEach(text => {
        const btn = document.createElement('button');
        btn.className = 'quick-reply-btn';
        btn.textContent = text;
        btn.onclick = () => {
          document.getElementById('chatInput').value = text;
          div.remove();
          sendMessage();
        };
        div.appendChild(btn);
      });
      container.appendChild(div);
      scrollToBottom();
    }

    function scrollToBottom() {
      const container = document.getElementById('chatMessages');
      requestAnimationFrame(() => { container.scrollTop = container.scrollHeight; });
    }

    function escapeHtml(text) {
      const el = document.createElement('span');
      el.textContent = text;
      return el.innerHTML;
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function showToast(msg, isError) {
      const toast = document.getElementById('errorToast');
      toast.textContent = msg;
      toast.style.background = isError ? 'rgba(192, 57, 43, 0.92)' : 'rgba(39, 174, 96, 0.92)';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Auto-resize textarea
    document.addEventListener('DOMContentLoaded', () => {
      const textarea = document.getElementById('chatInput');
      textarea.addEventListener('input', () => autoResize(textarea));
    });

    // --- Boot ---
    init();
  </script>
